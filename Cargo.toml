[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
default-members = ["crates/*"]

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/LuisPeixoto/zorix"
homepage = "https://github.com/LuisPeixoto/zorix"
readme = "README.md"
authors = ["Luis Peixoto"]
rust-version = "1.97"
# Nothing here is published to crates.io; ZORIX ships as installers and CLI archives.
publish = false

[workspace.dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
zorix-core = { path = "crates/zorix-core" }
zorix-runtime = { path = "crates/zorix-runtime" }
zorix-store = { path = "crates/zorix-store" }
zorix-sim = { path = "crates/zorix-sim" }
zorix-tools = { path = "crates/zorix-tools" }
zorix-providers = { path = "crates/zorix-providers" }
zorix-mcp = { path = "crates/zorix-mcp" }
zorix-integrations = { path = "crates/zorix-integrations" }
zorix-sandbox = { path = "crates/zorix-sandbox" }
zorix-hub = { path = "crates/zorix-hub" }
zorix-agents = { path = "crates/zorix-agents" }
zorix-memory = { path = "crates/zorix-memory" }
zorix-workflows = { path = "crates/zorix-workflows" }
zorix-projects = { path = "crates/zorix-projects" }
zorix-workforce = { path = "crates/zorix-workforce" }

async-trait = "0.1"
globset = "0.4"
html2text = "0.17"
ignore = "0.4"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
dirs = "7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
keyring = "4"
jsonschema = { version = "0.61", default-features = false }
parking_lot = "0.12"
pdf-extract = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.43", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = { version = "1", default-features = false, features = ["parse", "serde", "display"] }
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "signal", "net"] }
tokio-util = "0.7"
tracing = "0.1"
# Watching a folder of documents for changes (ADR-0048).
notify = "9"
# Reading the text of scanned pages on this computer (ADR-0048): the OCR engine, its runtime, a JPEG decoder and the PDF reader the text path already uses.
ocrs = "0.14"
rten = "0.28"
zune-jpeg = { version = "0.5", default-features = false }
zune-core = "0.5"
lopdf = { version = "0.42", default-features = false }
# OpenTelemetry export of the run spans (ADR-0046): HTTP only, no gRPC.
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "trace", "reqwest-blocking-client"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
wiremock = "0.6"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }

# Keep debug builds small: this machine and many CI runners have little disk to spare.
[profile.dev]
debug = "line-tables-only"

# The sandbox compiles WebAssembly at run time. Unoptimised, that takes many seconds, which makes the tests (and a developer's
# first run) painful; the compiler is optimised even in debug builds.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-control]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package.gimli]
opt-level = 3
[profile.dev.package.object]
opt-level = 3

# The OCR engine does its sums on millions of numbers a page; unoptimised, a page takes minutes, so its crates are optimised even in debug builds.
[profile.dev.package.ocrs]
opt-level = 3
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-imageproc]
opt-level = 3
[profile.dev.package.rten-parallel]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rten-onnx]
opt-level = 3
[profile.dev.package.rten-sequence]
opt-level = 3
[profile.dev.package.rten-shape-inference]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

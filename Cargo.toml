[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/LuisPeixoto/zorix"
homepage = "https://github.com/LuisPeixoto/zorix"
readme = "README.md"
authors = ["Luis Peixoto"]
rust-version = "1.90"

[workspace.dependencies]
zorix-core = { path = "crates/zorix-core" }
zorix-runtime = { path = "crates/zorix-runtime" }
zorix-store = { path = "crates/zorix-store" }
zorix-sim = { path = "crates/zorix-sim" }
zorix-tools = { path = "crates/zorix-tools" }
zorix-providers = { path = "crates/zorix-providers" }

async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
keyring = "4"
jsonschema = { version = "0.61", default-features = false }
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = { version = "1", default-features = false, features = ["parse", "serde", "display"] }
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "signal", "net"] }
tokio-util = "0.7"
tracing = "0.1"
wiremock = "0.6"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }

# Keep debug builds small: this machine and many CI runners have little disk to spare.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

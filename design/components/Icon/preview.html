<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon</title></head>
<body>
<div id="root">
<div><div id="g" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px"></div>
<style>.ic{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 9px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--fg);font-size:10.5px}.ic span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.ic.v3{border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}.ic.v3 span{color:var(--accent)}</style></div>
<script>var Z=window.Zorix,h='';Object.keys(Z.ICONS).forEach(function(n){h+='<div class="ic'+(Z.V3_ICONS.indexOf(n)>=0?' v3':'')+'" title="'+n+'">'+Z.icon(n,20)+'<span>'+n+'</span></div>'});document.getElementById('g').innerHTML=h;Z.hydrate();</script>
</div>

</body>
</html>

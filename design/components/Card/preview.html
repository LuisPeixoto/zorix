<!doctype html>
<html>
<head><meta charset="utf-8"><title>Card</title></head>
<body>
<div id="root">
<div class="zx-card" style="max-width:520px"><div class="zx-card__head"><i data-i="bot" data-s="15"></i>Research desk<div class="zx-card__actions"><span class="zx-badge tone-ok"><span class="zx-dot"></span>Ready</span><button class="zx-iconbtn zx-iconbtn--sm" aria-label="Edit"><i data-i="edit" data-s="14"></i></button></div></div><div class="zx-card__body"><p style="margin:0 0 12px;color:var(--muted);line-height:1.6">A lead that splits a question, asks the researcher and the data analyst at once, and writes one answer with sources.</p><div class="zx-row"><span class="zx-stack"><span class="zx-avatar zx-avatar--sm tone-accent"><i data-i="search" data-s="12"></i></span><span class="zx-avatar zx-avatar--sm tone-cyan"><i data-i="table" data-s="12"></i></span><span class="zx-avatar zx-avatar--sm tone-ok"><i data-i="edit" data-s="12"></i></span></span><span class="zx-muted" style="font-size:12px">3 agents · up to 3 levels</span></div></div><div class="zx-card__foot"><button class="zx-btn zx-btn--ghost zx-btn--sm"><span>Edit team</span></button><button class="zx-btn zx-btn--primary zx-btn--sm"><i data-i="message" data-s="13"></i><span>Open chat</span></button></div></div>
</div>
<script>Zorix.hydrate();</script>
</body>
</html>

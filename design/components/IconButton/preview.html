<!doctype html>
<html>
<head><meta charset="utf-8"><title>IconButton</title></head>
<body>
<div id="root">
<div class="zx-row">
  <button class="zx-iconbtn" aria-label="Pause"><i data-i="pause"></i></button>
  <button class="zx-iconbtn" aria-label="Filter"><i data-i="filter"></i></button>
  <button class="zx-iconbtn zx-iconbtn--secondary" aria-label="Fit to screen"><i data-i="maximize"></i></button>
  <button class="zx-iconbtn zx-iconbtn--secondary" aria-label="Copy id"><i data-i="copy"></i></button>
  <button class="zx-iconbtn zx-iconbtn--danger" aria-label="Delete"><i data-i="trash"></i></button>
  <button class="zx-iconbtn zx-iconbtn--sm" aria-label="More"><i data-i="sliders" data-s="14"></i></button>
</div>
</div>
<script>Zorix.hydrate();</script>
</body>
</html>

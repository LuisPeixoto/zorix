<!-- @dsCard group="Forms" height=330 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Field</title></head>
<body>
<div id="root">
<div class="zx-grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px 20px">
  <label class="zx-field" style="grid-row:span 2"><span class="zx-field__label">Prompt</span><span class="zx-textarea zx-input--focus" style="min-height:112px">Summarise the open incidents from this week and draft the Friday update<span class="zx-caret" style="width:1.5px;margin-left:1px"></span></span><span class="zx-field__hint">Say what you want done, in plain words.</span></label>
  <label class="zx-field"><span class="zx-field__label">API key<span class="req">*</span></span><span class="zx-input"><i data-i="key" data-s="14"></i><span class="zx-mono zx-placeholder">Paste the key</span></span><span class="zx-field__hint">Stored in the system keychain, never in a file.</span></label>
  <label class="zx-field"><span class="zx-field__label">Workspace</span><span class="zx-input zx-input--invalid"><i data-i="folder" data-s="14"></i><span class="zx-mono">/Users/me/missing</span></span><span class="zx-field__error"><i data-i="x-circle" data-s="12"></i>That folder does not exist.</span></label>
  <label class="zx-field"><span class="zx-field__label">Model</span><span class="zx-select"><span>anthropic/claude-opus-5-5</span><i data-i="chevron-down" data-s="14"></i></span></label>
  <label class="zx-field"><span class="zx-field__label">Budget per run</span><span class="zx-input"><i data-i="dollar" data-s="14"></i><span class="tnum">2.00</span><span class="zx-faint" style="margin-left:auto;font-size:11.5px">USD</span></span></label>
</div>
</div>
<script>Zorix.hydrate();</script>
</body>
</html>

<!doctype html>
<html>
<head><meta charset="utf-8"><title>Toast</title></head>
<body>
<div id="root">
<div class="zx-col" style="gap:10px;align-items:flex-start">
  <div class="zx-toast tone-ok"><i data-i="check-circle" data-s="16"></i><span>Key saved</span><button class="zx-iconbtn zx-iconbtn--sm" aria-label="Dismiss"><i data-i="x" data-s="13"></i></button></div>
  <div class="zx-toast tone-err" role="alert"><i data-i="x-circle" data-s="16"></i><span>Could not reach Ollama at 127.0.0.1:11434</span><button class="zx-btn zx-btn--ghost zx-btn--sm"><span>Retry</span></button></div>
  <div class="zx-toast tone-accent"><i data-i="store" data-s="16"></i><span>Installed Research desk 2.1 from the Marketplace</span></div>
</div>
</div>
<script>Zorix.hydrate();</script>
</body>
</html>

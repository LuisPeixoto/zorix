<!doctype html>
<html>
<head><meta charset="utf-8"><title>CommandPalette</title></head>
<body>
<div id="root">
<div class="zx-scrim" style="min-height:360px;background:var(--page-wash),color-mix(in srgb,var(--fg) 12%,var(--bg))"><div class="zx-palette zx-glass" role="combobox" aria-expanded="true"><div class="zx-palette__search"><i data-i="search" data-s="17"></i><span>inc<span class="zx-caret" style="width:1.5px"></span></span><span style="margin-left:auto" class="zx-kbd">esc</span></div><div class="zx-palette__group"><span class="zx-label">Workflows</span><div class="zx-palette__item zx-palette__item--on"><i data-i="workflow"></i><span><mark>Inc</mark>ident triage</span><span class="zx-kbd">↵</span></div><div class="zx-palette__item"><i data-i="play"></i><span>Run <mark>inc</mark>ident triage now</span></div></div><div class="zx-palette__group"><span class="zx-label">Projects</span><div class="zx-palette__item"><i data-i="kanban"></i><span>Q4 <mark>inc</mark>ident review</span><span class="zx-faint" style="font-size:11.5px">12 tasks</span></div></div><div class="zx-palette__group" style="padding-bottom:10px"><span class="zx-label">Command Center</span><div class="zx-palette__item"><i data-i="activity"></i><span>Logs filtered by <mark>inc</mark>idents</span></div></div></div></div>
</div>
<script>Zorix.hydrate();</script>
</body>
</html>

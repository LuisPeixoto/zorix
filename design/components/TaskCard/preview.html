<!doctype html>
<html>
<head><meta charset="utf-8"><title>TaskCard</title></head>
<body>
<div id="root">
<div class="zx-grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))"><div class="zx-task "><div class="zx-task__top"><span>OPS-38</span><span class="zx-prio zx-prio--urgent"><i data-i="flag" data-s="11"></i>Urgent</span></div><div class="zx-task__title">Triage incident backlog</div><div class="zx-progress"><span class="zx-sparkbar"><i style="width:64%"></i></span><span class="tnum" style="font-size:11px;color:var(--muted)">64%</span></div><div class="zx-task__meta"><span class="zx-due zx-due--late"><i data-i="clock" data-s="12"></i>Today</span><span class="zx-avatar zx-avatar--sm tone-accent"><i data-i="search" data-s="12"></i></span></div></div><div class="zx-task "><div class="zx-task__top"><span>OPS-40</span><span class="zx-prio zx-prio--high"><i data-i="flag" data-s="11"></i>High</span></div><div class="zx-task__title">Migrate alerts to the Command Center</div><div class="zx-task__meta"><span class="zx-deps"><i data-i="link" data-s="12"></i>2</span><span class="zx-due"><i data-i="calendar" data-s="12"></i>Nov 28</span><span class="zx-stack"><span class="zx-avatar zx-avatar--sm tone-cyan"><i data-i="table" data-s="12"></i></span><span class="zx-avatar zx-avatar--sm zx-avatar--round tone-muted" style="font-size:10px;font-weight:600">AK</span></span></div></div><div class="zx-task "><div class="zx-task__top"><span>OPS-41</span><span class="zx-prio zx-prio--low"><i data-i="flag" data-s="11"></i>Low</span></div><div class="zx-task__title">Retention policy for stored executions</div><div class="zx-task__meta"><span class="zx-deps"><i data-i="paperclip" data-s="12"></i>1</span><span class="zx-avatar zx-avatar--sm zx-avatar--round tone-muted" style="font-size:10px;font-weight:600">LP</span></div></div></div>
</div>
<script>Zorix.hydrate();</script>
</body>
</html>

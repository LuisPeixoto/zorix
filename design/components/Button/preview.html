<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div id="root">
<div class="zx-col" style="gap:14px">
  <div class="zx-row">
    <button class="zx-btn zx-btn--primary"><i data-i="play" data-s="14"></i><span>Start run</span></button>
    <button class="zx-btn zx-btn--secondary"><i data-i="refresh"></i><span>Refresh</span></button>
    <button class="zx-btn zx-btn--subtle"><i data-i="sparkles"></i><span>Suggest</span></button>
    <button class="zx-btn zx-btn--ghost"><i data-i="copy"></i><span>Copy</span></button>
    <button class="zx-btn zx-btn--danger"><i data-i="trash"></i><span>Remove key</span></button>
    <button class="zx-btn zx-btn--secondary" disabled><span>Disabled</span></button>
  </div>
  <div class="zx-row">
    <button class="zx-btn zx-btn--secondary zx-btn--sm"><span>Small</span></button>
    <button class="zx-btn zx-btn--secondary"><span>Medium</span></button>
    <button class="zx-btn zx-btn--primary zx-btn--lg"><span>Publish workflow</span><i data-i="arrow-right" data-s="17"></i></button>
    <button class="zx-btn zx-btn--primary zx-btn--loading" aria-busy="true"><span>Approve</span></button>
  </div>
</div>
</div>
<script>Zorix.hydrate();</script>
</body>
</html>

<!doctype html>
<html>
<head><meta charset="utf-8"><title>Switch</title></head>
<body>
<div id="root">
<div class="zx-col" style="gap:14px">
  <div class="zx-choice"><span class="zx-check"></span><span><b class="zx-mono" style="font-size:12px">math.evaluate</b><small>Allowed for this run only.</small></span></div>
  <div class="zx-choice"><span class="zx-check zx-check--on"><i data-i="check" data-s="11" data-w="3"></i></span><span><b class="zx-mono" style="font-size:12px">notes.put</b><small>Changes things, so it asks first.</small></span></div>
  <div class="zx-row" style="gap:10px"><span class="zx-switch zx-switch--on" role="switch" aria-checked="true"></span><span>Notify me when a run needs approval</span></div>
  <div class="zx-row" style="gap:10px"><span class="zx-switch" role="switch" aria-checked="false"></span><span class="zx-muted">Keep everything on this computer (local only)</span></div>
</div>
</div>
<script>Zorix.hydrate();</script>
</body>
</html>

[package]
name = "zorix-mcp"
description = "ZORIX's Model Context Protocol client: stdio and HTTP transports, both protocol eras, tool pinning."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "zorix-fake-mcp"
path = "src/bin/fake_server.rs"
test = false
doc = false

[dependencies]
zorix-core.workspace = true
zorix-net.workspace = true
zorix-oauth.workspace = true
zorix-providers.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
tracing.workspace = true
jsonschema.workspace = true
base64 = "0.22"
bytes.workspace = true
futures-util.workspace = true
getrandom = "0.4"
reqwest.workspace = true
rustls.workspace = true
sha2.workspace = true

[dev-dependencies]
zorix-runtime.workspace = true
zorix-sim.workspace = true
zorix-store.workspace = true
tempfile.workspace = true
wiremock.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.8"
seccompiler = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

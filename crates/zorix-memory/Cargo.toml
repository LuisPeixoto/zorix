[package]
name = "zorix-memory"
description = "ZORIX memory: conversation, long-term facts, knowledge and operational records, retrieved into the context."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["html", "pdf", "ocr"]
html = ["dep:html2text"]
pdf = ["dep:pdf-extract"]
ocr = ["pdf", "dep:ocrs", "dep:rten", "dep:zune-jpeg", "dep:zune-core", "dep:lopdf"]

[dependencies]
zorix-core.workspace = true
zorix-runtime.workspace = true
async-trait.workspace = true
globset.workspace = true
html2text = { workspace = true, optional = true }
pdf-extract = { workspace = true, optional = true }
ocrs = { workspace = true, optional = true }
rten = { workspace = true, optional = true }
zune-jpeg = { workspace = true, optional = true }
zune-core = { workspace = true, optional = true }
lopdf = { workspace = true, optional = true }
ignore.workspace = true
notify.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
zorix-store.workspace = true
zorix-sim.workspace = true
zorix-tools.workspace = true
zorix-providers.workspace = true
tempfile.workspace = true

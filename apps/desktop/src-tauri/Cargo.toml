[package]
name = "zorix-desktop"
description = "ZORIX desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "zorix_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "zorix-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zorix-core.workspace = true
zorix-runtime.workspace = true
zorix-store.workspace = true
zorix-sim.workspace = true
zorix-tools.workspace = true
zorix-providers.workspace = true
zorix-memory.workspace = true
zorix-hub.workspace = true
zorix-agents.workspace = true
zorix-mcp.workspace = true
zorix-sandbox.workspace = true
zorix-integrations.workspace = true
zorix-workflows.workspace = true
zorix-projects.workspace = true
zorix-workforce.workspace = true
futures-util.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

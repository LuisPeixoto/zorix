name: Fuzz

# Runs each fuzz target for a fixed time, once a week and on demand. A crash is uploaded as an artifact; the input becomes a regression test
# in the crate that owns the code (see docs/testing.md).
on:
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to run each target"
        default: "120"

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - agent_yaml
          - agent_file
          - skill_md
          - sse
          - mcp_wire
          - mcp_import
          - workflow_file
          - expr
          - template
          - schedule
          - extract
          - access
          - workspace_path
          - defuse
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run the target
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=${{ inputs.seconds || '120' }} -rss_limit_mb=2048
      - name: Keep what crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}

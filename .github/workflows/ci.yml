name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check the documentation links
        if: runner.os == 'Linux'
        run: node tools/check-docs.mjs
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --exclude zorix-desktop --all-targets -- -D warnings
      - name: Fetch the Python module the sandbox tests use
        if: runner.os == 'Linux'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/python.wasm" "https://github.com/vmware-labs/webassembly-language-runtimes/releases/download/python%2F3.12.0%2B20231211-040d5a6/python-3.12.0.wasm"
          echo "e5dc5a398b07b54ea8fdb503bf68fb583d533f10ec3f930963e02b9505f7a763  $RUNNER_TEMP/python.wasm" | sha256sum -c -
          echo "ZORIX_PYTHON_WASM=$RUNNER_TEMP/python.wasm" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --workspace --exclude zorix-desktop
        env:
          # The Linux runner has Docker, so the container sandbox is tried for real there (it pulls a pinned image).
          ZORIX_TEST_CONTAINER: ${{ runner.os == 'Linux' && '1' || '' }}

  audit:
    # Known vulnerabilities, licences, banned and unknown sources (deny.toml). Runs on every change, and the advisory
    # database is fetched fresh, so a new advisory can turn an unchanged tree red.
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  coverage:
    # What the tests cover, per crate. A report, not a gate: there is no target to chase, and the numbers show where an audit should look first.
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Fetch the Python module the sandbox tests use
        run: |
          curl -sSfL -o "$RUNNER_TEMP/python.wasm" "https://github.com/vmware-labs/webassembly-language-runtimes/releases/download/python%2F3.12.0%2B20231211-040d5a6/python-3.12.0.wasm"
          echo "e5dc5a398b07b54ea8fdb503bf68fb583d533f10ec3f930963e02b9505f7a763  $RUNNER_TEMP/python.wasm" | sha256sum -c -
          echo "ZORIX_PYTHON_WASM=$RUNNER_TEMP/python.wasm" >> "$GITHUB_ENV"
      - name: Run the tests with coverage
        run: |
          cargo llvm-cov --workspace --exclude zorix-desktop --exclude zorix-bench --lcov --output-path lcov.info
          cargo llvm-cov report --json --summary-only --output-path coverage.json
      - name: Say it per crate
        run: node tools/coverage-summary.mjs coverage.json --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            lcov.info
            coverage.json

  bench:
    # A tenth of the full data set, with limits that are many times what a healthy run takes: only a large regression fails. The numbers
    # that matter are in docs/testing.md, from full-size runs on a known machine.
    name: Benchmarks (a tenth of the scale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the data folder and time it
        run: cargo run --release -p zorix-bench -- --scale 0.1 --json bench.json --check crates/zorix-bench/limits.json
      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench
          path: bench.json

  postgres:
    # The Postgres tools need a real server, and a service container only exists on Linux runners.
    name: Postgres tools
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zorix
          POSTGRES_PASSWORD: zorix-test
          POSTGRES_DB: zorixtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zorix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test the Postgres tools against a real server
        env:
          ZORIX_TEST_POSTGRES: "127.0.0.1:5432:zorix:zorix-test:zorixtest"
        run: cargo test -p zorix-integrations --test db_postgres -- --nocapture

  desktop:
    name: Desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Check that the Tauri crates and npm packages match
        working-directory: apps/desktop
        run: node scripts/check-tauri-versions.mjs
      - name: Audit the production dependencies
        working-directory: apps/desktop
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check the interface
        working-directory: apps/desktop
        run: npm run check
      - name: Test the interface helpers
        working-directory: apps/desktop
        run: npm test
      - name: Check the design tokens against the design system
        run: node tools/design-tokens.mjs --check
      - name: Check the interface against the design system
        run: node tools/check-design.mjs
      - name: Check that every sentence is in the catalogue
        run: node tools/check-text.mjs
      - name: Build the interface
        working-directory: apps/desktop
        run: npm run build
      - name: Clippy (desktop shell)
        run: cargo clippy -p zorix-desktop --all-targets -- -D warnings

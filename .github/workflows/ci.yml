name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check the documentation links
        if: runner.os == 'Linux'
        run: node tools/check-docs.mjs
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --exclude zorix-desktop --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude zorix-desktop

  postgres:
    # The Postgres tools need a real server, and a service container only exists on Linux runners.
    name: Postgres tools
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zorix
          POSTGRES_PASSWORD: zorix-test
          POSTGRES_DB: zorixtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zorix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test the Postgres tools against a real server
        env:
          ZORIX_TEST_POSTGRES: "127.0.0.1:5432:zorix:zorix-test:zorixtest"
        run: cargo test -p zorix-integrations --test db_postgres -- --nocapture

  desktop:
    name: Desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Check that the Tauri crates and npm packages match
        working-directory: apps/desktop
        run: node scripts/check-tauri-versions.mjs
      - name: Type-check the interface
        working-directory: apps/desktop
        run: npm run check
      - name: Test the interface helpers
        working-directory: apps/desktop
        run: npm test
      - name: Build the interface
        working-directory: apps/desktop
        run: npm run build
      - name: Clippy (desktop shell)
        run: cargo clippy -p zorix-desktop --all-targets -- -D warnings

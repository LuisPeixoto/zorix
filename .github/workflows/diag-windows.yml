# Temporary: runs on this branch only, to see on Windows what cannot be seen on this computer. Removed before the merge.
name: Windows diagnosis
on:
  push:
    branches: [fix/workspace-windows-concurrency]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p zorix-tools files_that_share -- --nocapture
        continue-on-error: true
      - run: cargo test -p zorix-workflows -p zorix-workforce -p zorix-tools --no-fail-fast

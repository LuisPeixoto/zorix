# Temporary: proves the container sandbox on this branch before it reaches main. Removed before the merge.
name: Linux container check
on:
  push:
    branches: [feat/mcp-sandbox-container]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p zorix-mcp --all-targets -- -D warnings
      - run: cargo test -p zorix-mcp --test container --test sandbox -- --nocapture
        env:
          ZORIX_TEST_CONTAINER: "1"

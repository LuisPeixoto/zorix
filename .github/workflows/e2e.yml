name: End-to-end

# Builds the desktop app and drives it (ADR-0042). Linux goes through tauri-driver. macOS's web view has no WebDriver, and on Windows msedgedriver never
# found the WebView2 debugging port on the runner (the issue linked in docs/testing.md), so both start the app and wait for it to say it has loaded. Every run uses a throwaway data folder. A failing scenario uploads a screenshot and the page's source.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
      - name: Install the frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build the app
        working-directory: apps/desktop
        run: npx tauri build --debug --no-bundle

      # Every system: the app starts and loads its interface. On macOS, where WebKit has no WebDriver, this is the whole check.
      - name: Start the app and wait for it to load
        shell: bash
        run: |
          app="target/debug/zorix-desktop"
          if [ "$RUNNER_OS" = Windows ]; then app="$app.exe"; fi
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a node tools/e2e/smoke.mjs "$app" 120; else node tools/e2e/smoke.mjs "$app" 120; fi

      # Linux: the scenarios.
      - name: Install tauri-driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --locked
      - name: Run the scenarios (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node tools/e2e/run.mjs target/debug/zorix-desktop
      - name: Keep what a failure left
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}
          path: e2e-artifacts
          if-no-files-found: ignore
